[tool.poetry]
name = "defensive-prog-in-py"
version = "0.1.0"
description = "Defensive programming live coding and exercises in Python"
authors = ["Guillaume"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
pydantic = "^2.13.4"
returns = "^0.30.0"
expression = "^6.0.1"
hypothesis = "^6.152.9"
pytest = "^9.0.3"
httpx = "^0.28.1"

[tool.pytest.ini_options]
addopts = "--tb=short -q --import-mode=importlib"
testpaths = ["exercises"]

[tool.hypothesis]
max_examples = 200

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pyright (>=1.1.414,<2.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]
